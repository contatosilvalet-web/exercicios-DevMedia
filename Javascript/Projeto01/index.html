<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Juros</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Calculadora de Juros</h1>

        <form id="formulario-divida">
            <label for="valor-divida">
                Valor da dívida (R$)
            </label>
            <input
                type="number"
                id="valor-divida"
                min="0.01"
                step="0.01"
                placeholder="Ex.: 1000"
                required
            >

            <label for="dias-atraso">
                Dias de atraso
            </label>
            <input
                type="number"
                id="dias-atraso"
                min="0"
                step="1"
                placeholder="Ex.: 20"
                required
            >

            <button type="submit">
                Calcular juros
            </button>
        </form>

        <section id="resultado" aria-live="polite">
            <h2>Resultado</h2>
            <p>Preencha os campos para calcular.</p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
